name: Verify actions lock
description: Verify GitHub action pins
runs:
  using: composite
  steps:
    - name: Validate checkout
      env:
        GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
      shell: bash
      run: |
        set -Cfu -o posix
        shopt -s lastpipe
        <<EOF exec git sparse-checkout check-rules | {
        .github
        EOF
            unset -v path
            IFS= read -r path
        }
    - name: Install
      env:
        arg1: v1.17.0
        GH_TOKEN: ${{ github.token }}
      shell: sh
      run: |
        set -Cfu
        set -- "$arg1"; unset -v arg1
        unset -v repo; readonly repo=kjanat/actionlint
        unset -v tempfile; tempfile=
        trap 'case $tempfile in ("") ;; (*) command -p rm -- "${tempfile:?}"; esac' EXIT
        tempfile=$(exec mktemp)
        command gh release -R "$repo" download --clobber -O "${tempfile:?}" -p actionlint_*_linux_amd64.tar.gz -- "${1:?}"
        command gh release -R "$repo" verify-asset -- "${1:?}" "${tempfile:?}"
        (CDPATH='' cd -- ~/; command -p mkdir -p .local/bin)
        command tar -C ~/.local/bin -xzf "${tempfile:?}" -- actionlint
    - name: Run
      shell: sh
      run: |
        set -Cfu --
        unset -v config_file
        config_file=.github/actionlint.yaml
        command -p [ -e "${config_file:?}" ] || {
            config_file=
            trap 'case $config_file in ("") ;; (*) command -p rm -- "${config_file:?}"; esac' EXIT
            config_file=$(exec mktemp)
            >>"${config_file:?}" command -p printf %s "\
        # yaml-language-server: \$schema=https://raw.githubusercontent.com/kjanat/actionlint/refs/tags/v1.17.0/actionlint.schema.json
        # https://github.com/kjanat/actionlint/blob/v1.17.0/docs/config.md
        config-variables: []
        config-secrets: []
        policy:
            disallow-suppressions: true
            require-job-timeout: true
        "
        }
        command actionlint -color -config-file "${config_file:?}"
