name: Verify actions lock
description: Verify GitHub action pins
runs:
  using: composite
  steps:
    - name: Validate checkout
      env:
        GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
      shell: bash
      run: |-
        set -Cfu -o posix
        unset -v ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
        shopt -s lastpipe
        <<'EOF' exec git sparse-checkout check-rules | {
        .github
        EOF
            unset -v path
            IFS= read -r path
        }
    - name: Install
      env:
        GH_TOKEN: ${{ github.token }}
      shell: sh
      run: |-
        set -Cfu
        unset -v ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
        exec gh extension install github/gh-actions-lock
    - name: Run
      env:
        GH_TOKEN: ${{ github.token }}
      shell: sh
      run: |-
        set -Cfu
        unset -v ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
        exec gh actions-lock --verify
