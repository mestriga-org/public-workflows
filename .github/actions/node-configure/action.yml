name: Configure node.js
description: Set node.js environment variables
runs:
  using: composite
  steps:
    - shell: sh
      run: |
        # for node # for v25.8
        set -Cfu -- \
          --no-addons \
          --disable-proto=delete \
          --force-context-aware \
          --force-node-api-uncaught-exceptions-policy \
          --frozen-intrinsics \
          --no-global-search-paths \
          --pending-deprecation \
          --tls-min-v1.3
        >>"${GITHUB_ENV:?}" command -p printf 'NODE_OPTIONS=%s' "$*"
