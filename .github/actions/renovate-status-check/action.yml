name: Rnovate commit status check
description: Checks renovate commit statuses
runs:
  using: composite
  steps:
    - if: startsWith(github.head_ref, 'renovate/')
      uses: actions/github-script@v9.0.0
      with:
        script: |
          const { data } = await github.rest.repos.listCommitStatusesForRef({
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: context.payload.pull_request.head.sha
          })
          const regex = /^renovate\//
          for (const { context, state } of data)
            if (regex.test(context) && state !== 'success')
              core.setFailed(context)
