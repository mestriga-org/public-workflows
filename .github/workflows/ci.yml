# This workflow is managed by gh actions-lock.

name: CI
on:
  merge_group:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    shell: sh
env:
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: {}
jobs:
  git-check:
    permissions:
      contents: read
    uses: $/.github/workflows/git-check.yml
  renovate-artifacts-status-check:
    if: startsWith(github.head_ref, 'renovate/')
    permissions:
      statuses: read
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |-
            const { data } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            })
            const { state } = data.find(({ context }) => context === 'renovate/artifacts')
            if ('success' !== state) core.setFailed(state)
  ci-success:
    if: always()
    needs:
      - git-check
      - renovate-artifacts-status-check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
