# This workflow is managed by gh actions-lock.

name: CI
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  git-check:
    permissions:
      contents: read
    uses: $/.github/workflows/git-check.yml
  ci-success:
    if: (!cancelled())
    permissions:
      statuses: read
    runs-on: ubuntu-slim
    timeout-minutes: 1
    needs:
      - git-check
    steps:
      - uses: $/.github/actions/node-configure
      - parallel:
        # TODO see if should look at commit or pr for renovate checks
        - uses: $/.github/actions/renovate-status-check
        # https://github.com/orgs/community/discussions/45058#discussioncomment-7465690
        - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          run: exit 1
