# This workflow is managed by gh actions-lock.

name: CI
on:
  merge_group:
  pull_request:
  push:
    branches: [main]
permissions: { }
jobs:
  git-check:
    permissions:
      contents: read
    uses: $/.github/workflows/git-check.yml
  success:
    if: always()
    needs:
      - git-check
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - if: startsWith(github.head_ref, 'renovate/')
        uses: actions/github-script@v9.0.0
        # TODO see if should use sha
        with:
          script: |-
            const { data } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            })
            const { state } = data.find({ context } => context === 'renovate/artifacts')
            if ('success' !== state) core.setFailed(state)
      - run: exit 1
