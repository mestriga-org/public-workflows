on:
  merge_group:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions: { }
jobs:
  git-check:
    permissions:
      contents: read
    uses: $/.github/workflows/git-check.yml
  pnpm-run-lint:
    permissions:
      contents: read
    uses: $/.github/workflows/pnpm-run-lint.yml
  workflow-lint:
    permissions:
      contents: read
    uses: $/.github/workflows/workflow-lint.yml
