# This workflow is managed by gh actions-lock.

name: CI
on:
  merge_group:
  pull_request:
  push:
    branches: [main]
defaults:
  run:
    shell: sh
env:
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: {}
jobs:
  git-check:
    permissions:
      contents: read
    uses: $/.github/workflows/git-check.yml
  renovate-status-check:
    permissions:
      statuses: read
    uses: $/.github/workflows/renovate-status-check.yml
  ci-success:
    if: always()
    needs:
      - git-check
      - renovate-status-check
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo ${{ needs.renovate-status-check.result }}
      - name: Fail if any dependency failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
