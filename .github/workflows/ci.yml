# This workflow is managed by gh actions-lock.

# need to be the pr merge commit?

name: CI
on:
  pull_request: { branches: main }
  push: { branches: main }
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  pnpm-run-lint:
    permissions: { contents: read }
    uses: $/.github/workflows/pnpm-run-lint.yml
  ci-success:
    if: (!cancelled())
    runs-on: ubuntu-slim
    timeout-minutes: 1
    needs:
      - pnpm-run-lint
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
