# This workflow is managed by gh actions-lock.

name: CI
on:
  pull_request:
  push:
    branches: main
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  git-check:
    permissions: { contents: read }
    uses: $/.github/workflows/git-check.yml
  merge-check:
    if: (!cancelled())
    permissions:
      statuses: read
    runs-on: ubuntu-slim
    timeout-minutes: 1
    needs:
      - git-check
    steps:
      - parallel:
        # TODO see if should look at commit or pr for renovate checks
        - uses: $/.github/actions/renovate-status-check
        - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
          run: exit 1
