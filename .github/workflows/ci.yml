# This workflow is managed by gh actions-lock.

name: CI
on:
  pull_request: { branches: main }
  push: { branches: main }
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-status-check:
    permissions: { statuses: read }
    uses: $/.github/workflows/renovate-status-check.yml
  git-check:
    permissions: { contents: read }
    uses: $/.github/workflows/git-check.yml
  workflow-lint:
    permissions: { contents: read }
    uses: $/.github/workflows/workflow-lint.yml
  ci:
    if: (!cancelled())
    runs-on: ubuntu-slim
    timeout-minutes: 1
    needs:
      - git-check
      - workflow-lint
      - renovate-status-check
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
