name: Git check
on: workflow_call
defaults: { run: { shell: sh } }
permissions: { }
jobs:
  git-check:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout: '!/'
          sparse-checkout-cone-mode: false
          # https://docs.github.com/repositories/working-with-files/managing-large-files/about-large-files-on-github#file-size-limits
          filter: blob:limit=100m
      - parallel:
          - name: Check whitespace attribute
            # can diff tree setting attr-source
            env:
              GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
            run: |-
              set -Cfu
              unset -v parent
              parent=$(command git hash-object -t tree -- /dev/null)
              exec git -c core.whitespace=tabwidth=1,indent_with_nontab diff-index --cached --check "${parent:?}" --
          - name: Check diff attributes
            # can grep a tree and set attr-source
            env:
              GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
            shell: bash
            run: |-
              set -Cfu -o posix
              command git grep --cached -qIG -e $'[^\x01-\xFF]' -- || case $? in (1) exit 0;; (*) exit; esac
              >&2 command -p echo Null byte in text file.
              exit 1
          - name: Check excludes
            # exclude-standard is not available in ls-tree
            # ignore patterns are never retrieved from trees
            env:
              GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
            shell: bash
            run: |-
              set -Cfu -o posix
              shopt -s lastpipe
              exec git ls-files -ci --exclude-standard -- | {
                  unset -v -- path
                  IFS= read -r path || case $? in (1) exit 0;; (*) exit; esac
                  >&2 command -p printf 'Ignored file: %s'\\n "${path:?}"
                  exit 1
              }
          - name: Check text attributes
            # eolinfo is not available in ls-tree
            env:
              GIT_TEST_DISALLOW_ABBREVIATED_OPTIONS: true
            shell: bash
            run: |-
              set -Cfu -o posix
              shopt -s lastpipe
              exec git ls-files -c --format='.%(eolinfo:index)%x09.%(eolattr)%x09%(path)' -- | {
                  unset -v -- info attr path
                  while :; do
                      IFS=$'\t' read -r -- info attr path || case $? in (1) break;; (*) exit; esac
                      info=${info#.}
                      case $info in ('') continue; esac
                      attr=${attr#.}
                      case $attr in (-text) continue; esac
                      case ${info:?} in
                          (lf|none) continue
                      ;;  (-text) case $attr in (''|text=auto*) continue; esac
                      esac
                      command -p printf "File with eolinfo '%s' and eolattr '%s': %s"\\n "${info:?}" "$attr" "${path:?}"
                      exit 1
                  done
              }
