on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
defaults:
  run:
    shell: sh
env:
  DO_NOT_TRACK: 1
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: { }
jobs:
  # TODO prefer diffing tree over index
  actionlint:
    name: Lint github actions and workflows
    permissions:
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      - name: Configure git
        uses: mestriga-org/public-workflows/actions/git-configure@main
      - name: Download and run actionlint
        env:
          arg1: v1.17.0
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- "$arg1"; unset -v arg1
          unset -v repo; readonly repo=kjanat/actionlint
          unset -v tempfile; tempfile=$(exec mktemp)
          command gh release -R "$repo" download --clobber -O "${tempfile:?}" -p actionlint_*_linux_amd64.tar.gz -- "${1:?}"
          command gh release -R "$repo" verify-asset -- "${1:?}" "${tempfile:?}"
          ls -al ~/.local
          #command -p tar -xzf "${tempfile:?}" actionlint
          #CDPATH= cd -- ~/
          #command -p mkdir -p .local/bin
