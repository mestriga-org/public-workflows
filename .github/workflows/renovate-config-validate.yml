# This workflow is managed by gh actions-lock.

on:
  workflow_call:
defaults:
  run:
    shell: sh
env:
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: {}
jobs:
  renovate-config-validate:
    permissions:
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: fail because checkout may be incorrect
        run: command -p false
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          # https://github.com/renovatebot/renovate/blob/42.42.0/lib/config/app-strings.ts#L1-L12
          sparse-checkout: |
            /renovate.json
            /renovate.json5
            /.github/renovate.json
            /.github/renovate.json5
            /.gitlab/renovate.json
            /.gitlab/renovate.json5
            /.renovaterc
            /.renovaterc.json
            /.renovaterc.json5
            /package.json
            !*/
      - name: renovate-config-validator
        uses: docker://renovate/renovate:44.138.0@sha256:32027ed5e5e450f76ee372fcd6e72c8114db7fdb28c97c520515a03ea4a0d77b
        with:
          # https://github.com/renovatebot/renovate/blob/42.42.0/lib/config-validator.ts
          entrypoint: renovate-config-validator
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }} --no-frozen-intrinsics
