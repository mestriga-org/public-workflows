name: Renovate config validation
on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          # https://github.com/renovatebot/renovate/blob/42.42.0/lib/config/app-strings.ts#L1-L12
          sparse-checkout: |-
            /renovate.json
            /renovate.json5
            /.github/renovate.json
            /.github/renovate.json5
            /.gitlab/renovate.json
            /.gitlab/renovate.json5
            /.renovaterc
            /.renovaterc.json
            /.renovaterc.json5
            /package.json
            !*/
      - name: Validate Renovate configuration
        uses: docker://renovate/renovate:44.176.2@sha256:1ffc71775d95bd2233bf5a867744c5a92d845b5928dee93f5bb22ced956e4e38
        with:
          # https://github.com/renovatebot/renovate/blob/42.42.0/lib/config-validator.ts
          entrypoint: renovate-config-validator
          args: --strict --
