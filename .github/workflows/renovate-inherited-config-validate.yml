on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-inherited-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /org-inherited-config.json
            !*/
      - name: Validate org-inherited-config.json
        uses: docker://renovate/renovate:44.227.4@sha256:fe058db9710840a4821f20190b3769e3ce709a049b8640aa2bf5f044969fe702
        with:
          entrypoint: renovate-config-validator
          args: --strict -- org-inherited-config.json
