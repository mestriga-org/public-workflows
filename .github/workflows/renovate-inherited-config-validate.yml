on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-inherited-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /org-inherited-config.json
            !*/
      - name: Validate org-inherited-config.json
        uses: docker://renovate/renovate:44.221.0@sha256:fc9d9ea902fa0f3892e0a6e0e4924b04e80becc3d475d8b14849b0e39b81c409
        with:
          entrypoint: renovate-config-validator
          args: --strict -- org-inherited-config.json
