on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-inherited-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /org-inherited-config.json
            !*/
      - name: Validate org-inherited-config.json
        uses: docker://renovate/renovate:44.215.0@sha256:10b921ce64cac11667849e7c1c4f0c4996d641f88b949652e69a324622538f7a
        with:
          entrypoint: renovate-config-validator
          args: --strict -- org-inherited-config.json
