# This workflow is managed by gh actions-lock.

on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-inherited-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /org-inherited-config.json
            !*/
      - uses: docker://renovate/renovate:44.151.2@sha256:9ea828b38867af0ca5f269e6c5feace9e74e7f035da150bb16f8c5f70bf2e6e8
        with:
          entrypoint: renovate-config-validator
          args: --strict -- org-inherited-config.json
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }}
