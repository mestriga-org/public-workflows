on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-inherited-config-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /org-inherited-config.json
            !*/
      - uses: docker://renovate/renovate:44.171.9@sha256:e9ac94a856b8a91a4fde3e00d3456aaa8112257524a9d77df38931f2ede8905a
        with:
          entrypoint: renovate-config-validator
          args: --strict -- org-inherited-config.json
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }}
