on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-preset-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /default.json
            /presets/*.json
            !*/
      - name: Glob presets
        id: glob-presets
        uses: actions/github-script@v9.0.0
        with:
          script: |
            (
              await (
                await glob.create('presets/*.json', {
                  followSymbolicLinks: false,
                  implicitDescendants: false,
                  matchDirectories: false,
                })
              ).glob()
            ).map((file) => {
              if (file.IndexOf('"') !== -1) core.setFailed('Double quotes')
              return `"${file}"`
            }).join(' ')
      - uses: docker://renovate/renovate:44.173.1@sha256:047258466c0bbc5c6e8adfc1ae25bdcef5f8781ba90f7e12904af6656e35e59f
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global -- default.json ${{ steps.glob-presets.outputs.result }}
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }} --addons --no-frozen-intrinsics
