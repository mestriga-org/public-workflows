on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-preset-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /default.json
            /presets/*.json
            !*/
      - name: Glob presets
        id: glob-presets
        uses: actions/github-script@v9.0.0
        with:
          script: |
            (
              await (
                await glob.create('presets/*.json', {
                  followSymbolicLinks: false,
                  implicitDescendants: false,
                  matchDirectories: false,
                })
              ).glob()
            ).map((file) => {
              if (file.IndexOf('"') !== -1) core.setFailed('Double quotes')
              return `"${file}"`
            }).join(' ')
      - uses: docker://renovate/renovate:44.174.0@sha256:1d257740562b9533894202caecb07fa3709bc818d33068185c5a58e5126b26c3
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global -- default.json ${{ steps.glob-presets.outputs.result }}
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }} --addons --no-frozen-intrinsics
