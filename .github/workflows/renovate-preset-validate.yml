on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-preset-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /default.json
            /presets/*.json
            !*/
      - name: Glob presets
        id: glob-presets
        uses: actions/github-script@v9.0.0
        with:
          script: |
            (
              await (
                await glob.create('*.bicepparam', {
                  followSymbolicLinks: false,
                  implicitDescendants: false,
                  matchDirectories: false,
                })
              ).glob()
            ).map((file) => {
              if (file.IndexOf('"') !== -1) core.setFailed('Double quotes')
              return `"${file}"`
            }).join(' ')
      - uses: docker://renovate/renovate:44.173.0@sha256:7605cf8002e4b48c282279f466b682a37c94070be4f138b81e1c879baa7c9915
        with:
          entrypoint: renovate-config-validator
          args: --strict --no-global -- default.json ${{ steps.glob-presets.outputs.result }}
        env:
          NODE_OPTIONS: ${{ env.NODE_OPTIONS }} --addons --no-frozen-intrinsics
