on: workflow_call
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-preset-validate:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-26.04
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |-
            /default.json
            /presets/*.json
            !*/
      - name: List presets
        id: list-presets
        shell: bash
        run: |
          set -Cfu -o posix -- presets/*.json
          {
            command -p printf result=
            while :; do
              case $# in (0) break; esac
              command -p [ -f "${1:?}" ] || case $? in (1) continue ;; (*) exit; esac
              case ${1:?} in (*[\"$'\n']*) command -p false; esac
              command -p printf ' "%s"' "${1:?}"
              shift
            done
            command -p echo
          }>>"$GITHUB_OUTPUT"
      - name: Validate Renovate presets
        uses: docker://renovate/renovate:44.175.5@sha256:8af47680e016b008c6d259ac633386eeef73ef4a6694c692f3b5f15d98523214
        with:
          entrypoint: renovate-config-validator
          # cannot be single quoted
          args: --strict --no-global -- default.json${{ steps.list-presets.outputs.result }}
