# This workflow is managed by gh actions-lock.

name: Renovate status check
on:
  workflow_call:
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  renovate-status-check:
    if: startsWith(github.head_ref, 'renovate/')
    permissions:
      statuses: read
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: $/.github/actions/node-configure
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { data } = await github.rest.repos.listCommitStatusesForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            })
            const { state } = data.find(({ context }) => context === 'renovate/artifacts')
            if ('success' !== state) core.setFailed(state)
