name: Renovate status check
on: workflow_call
defaults: { run: { shell: sh }}
permissions: { }
jobs:
  renovate-status-check:
    if: startsWith(github.head_ref, 'renovate/')
    permissions: { statuses: read }
    runs-on: ubuntu-slim
    timeout-minutes: 1
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const ref = context.payload.pull_request.head.ref
            const branch = ref.substring('renovate/'.length)
            if (branch === 'configure') return
            const name = `renovate/${branch === 'reconfigure' ? 'configValidation' : 'artifacts'}`
            const { data : { statuses } } = await octokit.rest.repos.getCombinedStatusForRef({ ...context.repo, ref })
            let { state } = statuses.find(({ context }) => context == name)
            if (state != 'success') core.setFailed('')
