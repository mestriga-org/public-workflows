on:
  workflow_run:
    branches: main
    types: completed
    workflows: ci
jobs:
  set-commit-status:
    runs-on: ubuntu-slim
    steps:
      # todo set description and context
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            const { conclusion, head_sha, html_url } = context.payload.workflow_run.head_sha
            let state = 'error'
            switch (conclusion) {
              case 'failure':
                state = 'failure'
                break
              case 'skipped':
              case 'neutral':
              case 'success':
                state = 'success'
                break
              default:
                state = 'error'
            }
            octokit.rest.repos.createCommitStatus({
              ..context.repo,
              sha: head_sha,
              state,
              context: 'my-test',
              target_url: html_url
            })




