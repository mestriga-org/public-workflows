on:
  workflow_run:
    branches: main
    types: [completed,in_progress]
    workflows: ci
permissions: { }
jobs:
  set-commit-status:
    permissions: { statuses: write }
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            console.log(context.payload.workflow_run)
            const { conclusion, head_sha, name, html_url } = context.payload.workflow_run
            let state = 'error'
            switch (conclusion) {
              case 'failure':
                state = 'failure'
                break
              case 'skipped':
              case 'neutral':
              case 'success':
                state = 'success'
                break
            }
            await octokit.rest.repos.createCommitStatus({
              ...context.repo,
              sha: head_sha,
              state,
              context: name,
              target_url: html_url
            })
