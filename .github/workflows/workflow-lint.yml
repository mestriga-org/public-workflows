# This workflow is managed by gh actions-lock.

on:
  merge_group:
  pull_request:
  push:
    branches: [main]
  workflow_call:
defaults:
  run:
    shell: sh
env:
  DO_NOT_TRACK: 1
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: {}
jobs:
  workflow-lint:
    permissions:
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout: .github
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: exec gh extension install github/gh-actions-lock
      - name: Run gh-actions-lock --verify-local
        env:
          GH_TOKEN: ${{ github.token }}
        run: exec gh actions-lock --verify-local
      - name: Install actionlint
        env:
          arg1: v1.17.0
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Cfu
          set -- "$arg1"; unset -v arg1
          unset -v repo; readonly repo=kjanat/actionlint
          unset -v tempfile; tempfile=
          trap 'case $tempfile in ("") ;; (*) command -p rm -- "${tempfile:?}"; esac' EXIT
          tempfile=$(exec mktemp)
          command gh release -R "$repo" download --clobber -O "${tempfile:?}" -p actionlint_*_linux_amd64.tar.gz -- "${1:?}"
          command gh release -R "$repo" verify-asset -- "${1:?}" "${tempfile:?}"
          (CDPATH='' cd -- ~/; command -p mkdir -p .local/bin)
          command tar -C ~/.local/bin -xzf "${tempfile:?}" -- actionlint
      - name: Run actionlint
        run: |
          set -Cfu --
          unset -v config_file
          config_file=.github/actionlint.yaml
          command -p [ -e "${config_file:?}" ] || {
              config_file=
              trap 'case $config_file in ("") ;; (*) command -p rm -- "${config_file:?}"; esac' EXIT
              config_file=$(exec mktemp)
              >>"${config_file:?}" command -p printf %s "\
          # yaml-language-server: \$schema=https://raw.githubusercontent.com/kjanat/actionlint/refs/tags/v1.17.0/actionlint.schema.json
          # https://github.com/kjanat/actionlint/blob/v1.17.0/docs/config.md
          config-variables: []
          config-secrets: []
          policy:
              disallow-suppressions: true
              require-job-timeout: true
          "
          }
          command actionlint -color -config-file "${config_file:?}"
