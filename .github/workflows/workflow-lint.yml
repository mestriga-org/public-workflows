# This workflow is managed by gh actions-lock.

# TODD verify cooldown period (need to create action-lock config.yaml)
name: Workflow lint
on:
  pull_request: { branches: main }
  push: { branches: main }
  workflow_call:
concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
defaults:
  run:
    shell: sh
permissions: {}
jobs:
  workflow-lint:
    permissions: { contents: read }
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout: .github
      - parallel:
        - name: Verify actions lock
          uses: $/.github/actions/actions-lock-verify
        - name: Actionlint
          uses: $/.github/actions/actionlint
