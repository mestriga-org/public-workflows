# This workflow is managed by gh actions-lock.

on: [workflow_call]
defaults:
  run:
    shell: sh
env:
  DO_NOT_TRACK: 1
  NODE_OPTIONS: >- # for v25.8
    --no-addons
    --disable-proto=delete
    --force-context-aware
    --force-node-api-uncaught-exceptions-policy
    --frozen-intrinsics
    --no-global-search-paths
    --pending-deprecation
    --tls-min-v1.3
permissions: { }
jobs:
  # TODO prefer diffing tree over index
  workflow-lint:
    permissions:
      contents: read
    timeout-minutes: 1
    runs-on: ubuntu-slim
    steps:
      - name: Configure git
        uses: $/.github/actions/git-configure
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
          sparse-checkout: .github
      - name: Install gh-actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: exec gh extension install github/gh-actions-lock
      - name: Verify actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: exec gh actions-lock --verify
      - name: Install actionlint
        env:
          arg1: v1.17.0
          GH_TOKEN: ${{ github.token }}
        run: |-
          set -- "$arg1"; unset -v arg1
          unset -v repo; readonly repo=kjanat/actionlint
          unset -v tempfile; tempfile=
          trap 'case $tempfile in ("") ;; (*) command -p rm -R -- "${tempfile:?}"; esac' EXIT
          tempfile=$(exec mktemp)
          command gh release -R "$repo" download --clobber -O "${tempfile:?}" -p actionlint_*_linux_amd64.tar.gz -- "${1:?}"
          command gh release -R "$repo" verify-asset -- "${1:?}" "${tempfile:?}"
          (CDPATH='' cd -- ~/; command -p mkdir -p .local/bin)
          command tar -C ~/.local/bin -xzf "${tempfile:?}"" -- actionlint
          command -p rm -- "${tempfile:?}"
      - name: Run actionlint
        run: exec actionlint -color
