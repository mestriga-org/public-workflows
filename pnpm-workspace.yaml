packages: []

audit:
  ignorePrune: true

autoDedupe: true

catalog:
  '@mestriga-org/eslint-config': github:mestriga-org/eslint-config#62520a7a15eb511f74ae2be95413d4ed6f3e02c8
  eslint: 10.11.0
catalogMode: strict

catalogPrune: true
dedupeDirectDeps: true
dedupePeers: true
disallowWorkspaceCycles: true
enablePrePostScripts: false
hoist: false
minimumReleaseAgeExcludePrune: true

nodeOptions: >-
  ${NODE_OPTIONS- }
  --no-addons
  --disable-proto=delete
  --force-context-aware
  --force-node-api-uncaught-exceptions-policy
  --frozen-intrinsics
  --no-global-search-paths
  --pending-deprecation
  --tls-min-v1.3

resolutionMode: lowest-direct
strictPeerDependencies: true
trustPolicyExcludePrune: true
